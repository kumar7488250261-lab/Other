name: Build APK, Release & Deploy Website

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  APP_MODULE: app
  BUILD_VARIANT: debug
  ASSETS_PATH: app/src/main/assets

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version name from build.gradle
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=?\s*"\K[^"]+' ${{ env.APP_MODULE }}/build.gradle* | head -1)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: ./gradlew :${{ env.APP_MODULE }}:assemble${{ env.BUILD_VARIANT == 'release' && 'Release' || 'Debug' }}

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find ${{ env.APP_MODULE }}/build/outputs/apk -iname "*.apk" | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          files: ${{ steps.apk.outputs.path }}
          make_latest: true

      - name: Copy latest app data into website folder
        run: |
          mkdir -p docs/data
          cp ${{ env.ASSETS_PATH }}/*.json docs/data/ 2>/dev/null || echo "No JSON assets found, skipping"

      - name: Write latest version info for the website
        run: |
          echo "{\"version\":\"${{ steps.version.outputs.version }}\",\"tag\":\"v${{ steps.version.outputs.version }}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > docs/data/version.json

      - name: Commit updated website data (if changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync data + version ${{ steps.version.outputs.version }} to website [skip ci]"
          file_pattern: docs/data/*

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo (latest, after data commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
