name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Extract versionName from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=?\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.${{ github.run_number }}"
          fi
          TAG_NAME="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          
          # Check if tag already exists in repo
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, appending run number to prevent duplicate"
            TAG_NAME="v${VERSION}-build${{ github.run_number }}"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify and Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -iname "*.apk" | head -1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Built APK not found in app/build/outputs/apk!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Kharsia Lobby ${{ steps.version.outputs.tag_name }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          body: |
            ### 🚂 Kharsia Lobby - Android Official Release
            **Version:** `${{ steps.version.outputs.version }}` (Build #${{ github.run_number }})
            **Target:** SECR Bilaspur Division • Indian Railways
            
            #### 📦 Download & Installation:
            1. Download the `.apk` asset attached below directly to your Android device.
            2. Open the downloaded file and select **Install**. (If prompted, enable *"Allow from this source"*).
            3. Log in with your Crew ID / Staff ID.
