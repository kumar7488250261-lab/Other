name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure gradlew is executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Ensure debug keystore is present
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Creating ~/.android/debug.keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            cp ~/.android/debug.keystore ./debug.keystore || true
          fi
          echo "Debug keystore configured successfully."

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify and Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 3 -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Searching all build outputs for .apk..."
            APK_PATH=$(find . -name "*.apk" | grep -v "unaligned" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not found after build!"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$APK_SIZE" -lt 100000 ]; then
            echo "::error::Built APK is suspiciously small: $APK_SIZE bytes"
            exit 1
          fi
          echo "Verified APK at $APK_PATH (Size: $APK_SIZE bytes)"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_filename=kharsia-lobby-debug-build-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="Kharsia Lobby Debug APK v1.0.${{ github.run_number }}"
          SOURCE_APK="${{ steps.locate_apk.outputs.apk_path }}"
          TARGET_APK="${{ runner.temp }}/${{ steps.locate_apk.outputs.apk_filename }}"

          cp "$SOURCE_APK" "$TARGET_APK"

          NOTES="### 🚂 Kharsia Lobby - Official Debug APK Release
          - **Build Run:** #${{ github.run_number }}
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Package:** \`${{ steps.locate_apk.outputs.apk_filename }}\`

          Download the \`.apk\` file directly from the Assets section below and install it on your Android device."

          echo "Publishing release $TAG_NAME..."
          gh release create "$TAG_NAME" "$TARGET_APK" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest || \
          gh release upload "$TAG_NAME" "$TARGET_APK" --clobber || true

      - name: Build Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 Android Debug APK Build Completed
          - **Status:** Succeeded
          - **Run Number:** #${{ github.run_number }}
          - **Artifact Name:** \`app-debug-apk\` (Available on this workflow summary page)
          - **GitHub Release Tag:** \`v1.0.${{ github.run_number }}\`
          - **Direct Download:** Download the \`.apk\` file from the **Artifacts** section below or the **Releases** tab.
          EOF
